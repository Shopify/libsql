syntax = "proto3";

package metadata;

enum DurabilityMode {
    RELAXED = 0;
    STRONG = 1;
    EXTRA = 2;
    OFF = 3;
}

// Database config used to send db configs over the wire and stored
// in the meta store.
message DatabaseConfig {
    bool block_reads = 1;
    bool block_writes = 2;
    // The reason why operations are blocked. This will be included in [`Error::Blocked`].
    optional string block_reason = 3;
    // maximum db size (in pages)
    uint64 max_db_pages = 4;
    optional string heartbeat_url = 5;
    optional string bottomless_db_id = 6;
    optional string jwt_key = 7;
    optional uint64 txn_timeout_s = 8;
    bool allow_attach = 9;
    optional uint64 max_row_size = 10;
    optional bool shared_schema = 11;
    optional string shared_schema_name = 12;
    optional DurabilityMode durability_mode = 13;
    // The namespace fence as seen by the primary when it answered. Only ever filled by the
    // primary's replication `Hello`, and only while a fence is active; it is never part of a
    // stored configuration. Absent from older primaries; older replicas ignore it and still
    // see the legacy `block_*` fields above.
    optional ReplicatedFence fence = 14;
}

// The part of a namespace fence a replica needs to apply the primary's read admission.
message ReplicatedFence {
    // The fence state name, e.g. "SOURCE_READ_FENCED".
    string state = 1;
    // The revision of the fence record the state belongs to.
    uint64 revision = 2;
}
